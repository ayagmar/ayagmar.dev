# Every check runs from this one workflow. `changes` decides which jobs a change needs
# (scripts/ci.ts), each job runs only when the plan says so, and `gate` fails unless every
# planned job succeeded. Branch rules require only `gate`. ADR 0018 explains the design.
# CI builds and tests but never deploys: Cloudflare Workers Builds deploys, and no Cloudflare
# credential lives in GitHub (`just ci-policy` enforces it).
name: CI

on:
  pull_request:
    # `labeled` too, so adding the `lighthouse` label runs Lighthouse. Every run plans the
    # same way, so a label never changes what the gate requires beyond adding Lighthouse.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  WRANGLER_SEND_METRICS: "false"

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # A pull request checks out its merge commit; depth 2 brings in the base parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - id: plan
        run: just ci-plan

  format:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just fmt-check

  secrets-source:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).secrets-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so a secret added and removed within the branch is still found.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just scan-secrets-source

  checks:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just lint
      - run: just typecheck
      - run: just knip
      - run: just boundaries
      - run: just test-scripts

  contracts:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just contracts-schema-check
      - run: just test-contracts

  site-test:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).site-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just test-site

  # Builds the site once per run; e2e and links test this artifact.
  site-build:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).site-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Cache Astro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/site/node_modules/.astro
          key: astro-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: astro-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: just site-build
      - run: just site-dist-check
      - run: just scan-site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 3

  e2e:
    needs: [changes, site-build]
    if: fromJSON(needs.changes.outputs.plan).e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist
      - id: playwright
        run: echo "version=$(node -p "require('./apps/site/package.json').devDependencies['@playwright/test']")" >> "${GITHUB_OUTPUT}"
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: just e2e-install
      # The resume tests read the generated PDF, which the artifact holds only once published.
      - run: just resume
      - run: just poppler-install
      - run: just e2e-test

  links:
    needs: [changes, site-build]
    if: fromJSON(needs.changes.outputs.plan).links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist
      - name: Cache external link results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - run: just links

  signals-test:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).signals-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just test-signals
      # Bundles offline (a dry run), then scans the bundle that would be deployed.
      - run: just signals-build
      - run: just scan-signals

  codeql:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  osv:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).osv
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just osv

  workflows:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs dependencies: ci-policy parses workflows with the yaml package.
      - uses: ./.github/actions/setup
      # The read-only token lets zizmor run its online audits (impostor commits, known
      # vulnerable actions).
      - run: just workflows-lint
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just ci-test
      - run: just ci-policy

  renovate:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just renovate-check

  shell:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).shell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just shell-lint

  # Static budgets on the site artifact (ADR 0017): JavaScript and weight per page, fonts,
  # no other origin, image dimensions.
  budgets:
    needs: [changes, site-build]
    if: fromJSON(needs.changes.outputs.plan).budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist
      - run: just budgets

  # Lighthouse on the base and head builds, both in fixtures mode and each served by its own
  # site Worker locally (ADR 0017). Head is the site artifact; base is built here from the pull
  # request's base commit, or on main from the commit before the push. Read-only: the comment
  # is posted by lighthouse-comment from the metrics artifact alone, uploaded even when the
  # budgets fail so the comment shows why.
  lighthouse:
    needs: [changes, site-build]
    if: fromJSON(needs.changes.outputs.plan).lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      metrics: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .lighthouse/base
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist
      - id: playwright
        run: echo "version=$(node -p "require('./apps/site/package.json').devDependencies['@playwright/test']")" >> "${GITHUB_OUTPUT}"
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: just e2e-install
      - name: Install the base
        working-directory: .lighthouse/base
        run: just install
      - name: Build the base
        working-directory: .lighthouse/base
        env:
          SIGNALS_MODE: fixtures
        run: just site-build
      - run: just lighthouse-ci
      - id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-metrics
          path: .lighthouse/metrics.json
          if-no-files-found: ignore
          retention-days: 3

  # Posts or updates the one Lighthouse comment on the pull request. The only job with a write
  # token, and only `pull-requests: write`: it checks out no code, runs no action but the
  # artifact download, and reads nothing but the metrics artifact, which the copy of
  # scripts/lighthouse-report.js below validates before rendering. Same-repository pull
  # requests only; on a fork it is skipped and the budgets still apply. Outside the gate
  # (scripts/ci.ts `ungated`): the lighthouse job enforces the budgets, and a failure to post
  # must not block a merge.
  lighthouse-comment:
    needs: lighthouse
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.lighthouse.outputs.metrics != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # create and edit its own comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lighthouse-metrics
          path: ${{ runner.temp }}/lighthouse
      - name: Validate the artifact and render the comment
        working-directory: ${{ runner.temp }}/lighthouse
        run: |
          node --input-type=module - render metrics.json comment.md <<'JS'
          // The Lighthouse metrics artifact (ADR 0017): its schema, the strict validator, and the
          // markdown of the sticky pull request comment. scripts/lighthouse.ts writes the artifact in
          // the read-only `lighthouse` job; the `lighthouse-comment` job, which holds the only write
          // token and never checks out code, runs a copy of this file embedded in ci.yml on the
          // downloaded artifact. Plain JavaScript with Node built-ins only, so the runner's own Node runs
          // it; a test in scripts/lighthouse-report.test.ts fails when that copy differs from this file.
          // The artifact came from a job that ran the pull request's code: nothing from it reaches the
          // comment or the log except numbers that passed the checks below. Page and metric names are
          // rendered from the tables here, never from the artifact.
          // Usage: node scripts/lighthouse-report.js render <metrics.json> <comment.md>
          import { readFileSync, statSync, writeFileSync } from 'node:fs';

          export const marker = '<!-- min7-lighthouse -->';
          export const version = 1;
          /** Larger artifacts are refused unread. The real one is about 4 KB. */
          export const maxBytes = 16_384;

          /** @type {Readonly<Record<string, string>>} Page names in the artifact, and their labels. */
          export const pages = {
            home: 'Home',
            post: 'A post',
            writing: 'Writing',
            projects: 'Projects',
            project: 'A project',
            about: 'About',
            stats: 'Stats',
          };
          export const profiles = /** @type {const} */ (['mobile', 'desktop']);

          /**
           * @typedef {'performance' | 'accessibility' | 'bestPractices' | 'lcp' | 'tbt' | 'cls'} Metric
           * @typedef {Record<Metric, number>} Values
           * @typedef {{ page: string, profile: 'mobile' | 'desktop', head: Values, base: Values | null,
           *   over: Metric[], regressed: Metric[] }} Result
           * @typedef {{ version: 1, runs: number, results: Result[] }} Metrics
           */

          /** @type {Readonly<Record<Metric, { label: string, max: number, format: (n: number) => string }>>} */
          export const metrics = {
            performance: { label: 'Performance', max: 1, format: (n) => String(Math.round(n * 100)) },
            accessibility: { label: 'Accessibility', max: 1, format: (n) => String(Math.round(n * 100)) },
            bestPractices: { label: 'Best practices', max: 1, format: (n) => String(Math.round(n * 100)) },
            lcp: { label: 'LCP', max: 120_000, format: (n) => `${(n / 1000).toFixed(2)} s` },
            tbt: { label: 'TBT', max: 120_000, format: (n) => `${Math.round(n)} ms` },
            cls: { label: 'CLS', max: 10, format: (n) => n.toFixed(3) },
          };
          const metricKeys = /** @type {Metric[]} */ (Object.keys(metrics));

          /** @param {unknown} value */
          const isObject = (value) => typeof value === 'object' && value !== null && !Array.isArray(value);

          /**
           * @param {unknown} value
           * @param {readonly string[]} keys
           * @param {string} where
           * @returns {Record<string, unknown>}
           */
          function exactObject(value, keys, where) {
            if (!isObject(value)) throw new Error(`${where}: not an object`);
            const object = /** @type {Record<string, unknown>} */ (value);
            const own = Object.keys(object);
            if (own.length !== keys.length || !keys.every((key) => Object.hasOwn(object, key))) {
              throw new Error(`${where}: fields are not exactly ${keys.join(', ')}`);
            }
            return object;
          }

          /**
           * @param {unknown} value
           * @param {string} where
           * @returns {Values}
           */
          function values(value, where) {
            const object = exactObject(value, metricKeys, where);
            /** @type {Partial<Values>} */
            const out = {};
            for (const key of metricKeys) {
              const n = object[key];
              if (typeof n !== 'number' || !Number.isFinite(n) || n < 0 || n > metrics[key].max) {
                throw new Error(`${where}.${key}: not a number from 0 to ${metrics[key].max}`);
              }
              out[key] = n;
            }
            return /** @type {Values} */ (out);
          }

          /**
           * @param {unknown} value
           * @param {string} where
           * @returns {Metric[]}
           */
          function metricList(value, where) {
            if (!Array.isArray(value) || value.length > metricKeys.length) {
              throw new Error(`${where}: not a list of metrics`);
            }
            const list = /** @type {unknown[]} */ (value);
            if (!list.every((m) => metricKeys.includes(/** @type {Metric} */ (m)))) {
              throw new Error(`${where}: names an unknown metric`);
            }
            if (new Set(list).size !== list.length) throw new Error(`${where}: repeats a metric`);
            return /** @type {Metric[]} */ (list.slice());
          }

          /**
           * Parses and checks an artifact. Returns a fresh copy holding only the known fields; throws
           * with a message that never repeats the artifact's content.
           * @param {string} text
           * @returns {Metrics}
           */
          export function validate(text) {
            if (Buffer.byteLength(text) > maxBytes) throw new Error(`artifact: over ${maxBytes} bytes`);
            /** @type {unknown} */
            let parsed;
            try {
              parsed = JSON.parse(text);
            } catch {
              throw new Error('artifact: not JSON');
            }
            const top = exactObject(parsed, ['version', 'runs', 'results'], 'artifact');
            if (top.version !== version) throw new Error(`artifact.version: not ${version}`);
            const runs = top.runs;
            if (typeof runs !== 'number' || !Number.isInteger(runs) || runs < 1 || runs > 9) {
              throw new Error('artifact.runs: not a whole number from 1 to 9');
            }
            const limit = Object.keys(pages).length * profiles.length;
            if (!Array.isArray(top.results) || top.results.length < 1 || top.results.length > limit) {
              throw new Error(`artifact.results: not a list of 1 to ${limit} results`);
            }
            const seen = new Set();
            const results = /** @type {unknown[]} */ (top.results).map((item, i) => {
              const where = `artifact.results[${i}]`;
              const r = exactObject(item, ['page', 'profile', 'head', 'base', 'over', 'regressed'], where);
              const page = r.page;
              if (typeof page !== 'string' || !Object.hasOwn(pages, page)) {
                throw new Error(`${where}.page: not a known page`);
              }
              const profile = /** @type {'mobile' | 'desktop'} */ (r.profile);
              if (!profiles.includes(profile)) throw new Error(`${where}.profile: not mobile or desktop`);
              if (seen.has(`${page} ${profile}`)) throw new Error(`${where}: repeats a page and profile`);
              seen.add(`${page} ${profile}`);
              return {
                page,
                profile,
                head: values(r.head, `${where}.head`),
                base: r.base === null ? null : values(r.base, `${where}.base`),
                over: metricList(r.over, `${where}.over`),
                regressed: metricList(r.regressed, `${where}.regressed`),
              };
            });
            return { version, runs, results };
          }

          /**
           * The comment body: one table per profile, base → head for each metric and page.
           * @param {Metrics} m
           * @returns {string}
           */
          export function render(m) {
            const failing = m.results.filter((r) => r.over.length > 0 || r.regressed.length > 0).length;
            const lines = [
              marker,
              '## Lighthouse',
              '',
              failing === 0
                ? 'Every page is within budget and no metric regressed.'
                : `${failing} page and profile ${failing === 1 ? 'combination fails' : 'combinations fail'}: ✗ over budget, ▲ regressed against the base. The \`lighthouse\` job fails.`,
              '',
              `Base → head, median of ${m.runs} ${m.runs === 1 ? 'run' : 'runs'} with simulated throttling, both built in fixtures mode. Budgets: ADR 0017.`,
            ];
            for (const profile of profiles) {
              const rows = m.results.filter((r) => r.profile === profile);
              if (rows.length === 0) continue;
              lines.push(
                '',
                `### ${profile === 'mobile' ? 'Mobile' : 'Desktop'}`,
                '',
                `| Page | ${metricKeys.map((k) => metrics[k].label).join(' | ')} |`,
                `| --- | ${metricKeys.map(() => '---').join(' | ')} |`
              );
              const order = Object.keys(pages);
              rows.sort((a, b) => order.indexOf(a.page) - order.indexOf(b.page));
              for (const r of rows) {
                const cells = metricKeys.map((k) => {
                  const { format } = metrics[k];
                  const base = r.base === null ? 'new' : format(r.base[k]);
                  const flags = `${r.over.includes(k) ? ' ✗' : ''}${r.regressed.includes(k) ? ' ▲' : ''}`;
                  return `${base} → ${format(r.head[k])}${flags}`;
                });
                lines.push(`| ${pages[r.page]} | ${cells.join(' | ')} |`);
              }
            }
            return `${lines.join('\n')}\n`;
          }

          if (process.argv[2] === 'render') {
            const [input = '', output = ''] = process.argv.slice(3);
            try {
              // Refuse an oversized file before reading it.
              if (statSync(input).size > maxBytes) throw new Error(`artifact: over ${maxBytes} bytes`);
              writeFileSync(output, render(validate(readFileSync(input, 'utf8'))));
              console.log('lighthouse-report: artifact valid, comment rendered');
            } catch (error) {
              console.error(`lighthouse-report: ${error instanceof Error ? error.message : 'failed'}`);
              process.exit(1);
            }
          }
          JS
      - name: Post or update the comment
        working-directory: ${{ runner.temp }}/lighthouse
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Only this workflow's own comment counts, whoever else copies the marker.
          ids="$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- min7-lighthouse -->"))) | .id')"
          id="${ids%%$'\n'*}"
          jq --null-input --rawfile body comment.md '{body: $body}' > request.json
          if [[ -n "${id}" ]]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" --input request.json > /dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" --input request.json > /dev/null
          fi

  # New jobs go here. Each one needs `changes`, runs
  # `if: fromJSON(needs.changes.outputs.plan).<job>`, has an entry in `jobs` in scripts/ci.ts
  # and is listed in the gate's `needs`. `just ci-test` fails until all three agree.

  gate:
    needs:
      [
        changes,
        format,
        secrets-source,
        checks,
        contracts,
        site-test,
        site-build,
        e2e,
        links,
        signals-test,
        codeql,
        osv,
        workflows,
        renovate,
        shell,
        budgets,
        lighthouse,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just ci-gate
        env:
          NEEDS: ${{ toJSON(needs) }}
