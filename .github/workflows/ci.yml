# Every check runs from this one workflow. `changes` decides which jobs a change needs
# (scripts/ci.ts), each job runs only when the plan says so, and `gate` fails unless every
# planned job succeeded. Branch rules require only `gate`. ADR 0018 explains the design.
# CI builds and tests but never deploys: Cloudflare Workers Builds deploys, and no Cloudflare
# credential lives in GitHub (`just ci-policy` enforces it).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  WRANGLER_SEND_METRICS: "false"

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      # A pull request checks out its merge commit; depth 2 brings in the base parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - id: plan
        run: just ci-plan >> "${GITHUB_OUTPUT}"

  format:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just fmt-check

  secrets-source:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).secrets-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The whole history, so a secret added and removed within the branch is still found.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just scan-secrets-source

  checks:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just lint
      - run: just typecheck
      - run: just knip
      - run: just boundaries
      - run: just test-scripts

  contracts:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just contracts-schema-check
      - run: just test-contracts

  site-test:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).site-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just test-site

  # Builds the site once per run; e2e and links test this artifact.
  site-build:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).site-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Cache Astro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/site/node_modules/.astro
          key: astro-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: astro-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: just site-build
      - run: just site-dist-check
      - run: just scan-site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 3

  e2e:
    needs: [changes, site-build]
    if: fromJSON(needs.changes.outputs.plan).e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist
      - id: playwright
        run: echo "version=$(node -p "require('./apps/site/package.json').devDependencies['@playwright/test']")" >> "${GITHUB_OUTPUT}"
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: just e2e-install
      - run: just e2e-test

  links:
    needs: [changes, site-build]
    if: fromJSON(needs.changes.outputs.plan).links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: apps/site/dist
      - name: Cache external link results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - run: just links

  signals-test:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).signals-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just test-signals
      # Bundles offline (a dry run), then scans the bundle that would be deployed.
      - run: just signals-build
      - run: just scan-signals

  codeql:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  osv:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).osv
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just osv

  workflows:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      # The read-only token lets zizmor run its online audits (impostor commits, known
      # vulnerable actions).
      - run: just workflows-lint
        env:
          GH_TOKEN: ${{ github.token }}
      - run: just ci-test
      - run: just ci-policy

  renovate:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just renovate-check

  shell:
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).shell
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just shell-lint

  # PR 5 (Lighthouse) and PR 6 (resume) add their jobs here. Each one needs `changes`, runs
  # `if: fromJSON(needs.changes.outputs.plan).<job>`, has an entry in `jobs` in scripts/ci.ts
  # and is listed in the gate's `needs`. `just ci-test` fails until all three agree.

  gate:
    needs:
      [
        changes,
        format,
        secrets-source,
        checks,
        contracts,
        site-test,
        site-build,
        e2e,
        links,
        signals-test,
        codeql,
        osv,
        workflows,
        renovate,
        shell,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: just ci-gate
        env:
          NEEDS: ${{ toJSON(needs) }}
