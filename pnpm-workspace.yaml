packages:
  - apps/*
  - packages/*

# Refuse versions published less than 3 days ago (minutes).
minimumReleaseAge: 4320

# Install scripts allowed to run: none. Packages listed false are known to have one and
# are denied explicitly. esbuild and workerd find their platform binary through
# optionalDependencies at run time; their postinstall only swaps in the binary to start faster.
allowBuilds:
  esbuild: false
  workerd: false

# Versions shared by more than one package, pinned once.
catalog:
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@types/node": 24.19.2
  msw: 3.0.4
  typescript: 6.0.3
  vitest: 5.1.0
  wrangler: 4.159.0

# Patched versions of transitive dependencies osv-scanner flags, until their parents update.
# Remove an entry once the parent package depends on a fixed version.
overrides:
  # Under @lhci/cli 0.16.0 (Lighthouse CI, ADR 0017). GHSA-c475-qrg2-pj4r, fixed in 6.2.1; via
  # proxy-agent.
  "get-uri>basic-ftp": 6.2.6
  # GHSA-g3hv-75wg-m249 in minimatch 3.1.5, through chrome-launcher 0.13.4 > rimraf 3 > glob 7.
  # @lhci/cli only calls Launcher.getInstallations(); 1.2.2 has it and drops rimraf.
  "@lhci/cli>chrome-launcher": 1.2.3
  # Under @stryker-mutator/core 10.1.1 (`just mutate`, ADR 0039). GHSA-g3hv-75wg-m249 in
  # minimatch 10.2.6, fixed from 11.0.1; 11.0.3 is the newest of that line at least three days
  # old, and keeps the `minimatch` and `Minimatch` Stryker imports. GHSA-4mjr-xmp4-gh2g,
  # GHSA-6pq8-jhm2-2vcw, GHSA-q8mj-m7cp-5q26 and GHSA-x5fp-wj9c-mxmx in qs 6.15.1 (through
  # typed-rest-client 2.3.1), fixed by 6.16.1.
  "@stryker-mutator/core>minimatch": 11.0.5
  "typed-rest-client>qs": 6.17.1

# Dependencies a package needs but does not declare, until its next release does.
packageExtensions:
  # @astrojs/astro2tsx 0.1.3 loads its WASM binding with @emnapi/core 1.11.3 but leaves
  # @emnapi/runtime to peer resolution, which picks the 2.0 beta Rolldown 1.3 brings; the
  # mismatched pair throws on import, and `astro check` reports @astrojs/check as missing.
  # 0.1.4 declares it (withastro/compiler-rs#219). Remove once the lockfile has 0.1.4.
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3
