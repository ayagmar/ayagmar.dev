packages:
  - apps/*
  - packages/*

# Refuse versions published less than 3 days ago (minutes).
minimumReleaseAge: 4320

# Install scripts allowed to run: none. Packages listed false are known to have one and
# are denied explicitly. esbuild and workerd find their platform binary through
# optionalDependencies at run time; their postinstall only swaps in the binary to start faster.
allowBuilds:
  esbuild: false
  workerd: false

# Versions shared by more than one package, pinned once.
catalog:
  "@types/node": 24.19.2
  msw: 3.0.3
  typescript: 6.0.3
  vitest: 5.0.5
  wrangler: 4.152.0

# Patched versions of transitive dependencies osv-scanner flags, until their parents update.
# Both are test and local-dev only (the Worker test runtime). Remove an entry once the parent
# package depends on a fixed version.
overrides:
  # GHSA-mrhx-c7xc-m3w5, fixed in 4.6.6; via @cloudflare/vitest-plugin 1.4.7.
  "@cloudflare/vitest-plugin>zod": 4.6.7
  # GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472, GHSA-xjj6-f33q-929c, fixed in 7.30.1; via miniflare.
  "miniflare>undici": 7.30.1
